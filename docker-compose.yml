# AgentWorkflow — môi trường phát triển cục bộ
#
# Hai chế độ chạy:
#
#   1. Chỉ hạ tầng (khuyến nghị khi code hằng ngày — chạy app từ .venv để hot reload):
#          docker compose up -d
#
#   2. Toàn bộ, gồm cả app container:
#          docker compose --profile app up -d --build
#
# Dừng và xoá sạch dữ liệu:
#          docker compose down -v
#
# Cổng dịch vụ:
#   PostgreSQL      localhost:5432
#   Redis           localhost:6379
#   MinIO API       localhost:9000     console: localhost:9001  (minio / minio123)
#   Temporal gRPC   localhost:7233
#   Temporal UI     localhost:8233
#   Jaeger UI       localhost:16686
#   OTLP gRPC       localhost:4317     OTLP HTTP: localhost:4318
#   API             localhost:8000     (profile app)
#   Agent Runtime   localhost:8001     (profile app)

name: agentworkflow

x-app-base: &app-base
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  profiles: [app]
  env_file:
    # Không bắt buộc: giá trị mặc định trong Settings đủ để container chạy được
    # ngay cả khi chưa có .env.
    - path: .env
      required: false
  environment:
    AW_DATABASE_URL: postgresql+asyncpg://agentworkflow:agentworkflow@postgres:5432/agentworkflow
    AW_REDIS_URL: redis://redis:6379/0
    AW_TEMPORAL_HOST: temporal:7233
    AW_S3_ENDPOINT_URL: http://minio:9000
    AW_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
  volumes:
    - ./services:/app/services:ro
    - ./packages:/app/packages:ro
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    temporal: {condition: service_healthy}
    minio: {condition: service_healthy}

services:
  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL — nguồn chân lý giao dịch (§4.5)
  # Chứa cả database ứng dụng lẫn database của Temporal. Ở production hai thứ
  # này phải là hai cụm riêng biệt.
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentworkflow
      POSTGRES_PASSWORD: agentworkflow
      POSTGRES_DB: agentworkflow
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentworkflow -d agentworkflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — CHỈ dùng cho state phù du (§4.6)
  # Không bao giờ là nguồn chân lý cho workflow, execution state, membership,
  # billing, hay lịch sử trace.
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # MinIO — object storage S3-compatible (§4.7)
  # Lưu payload lớn: tool output, raw trace, file đính kèm. PostgreSQL chỉ giữ
  # reference (§47.14).
  # ───────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Tạo bucket lần đầu rồi thoát.
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/aw-traces &&
      mc mb --ignore-existing local/aw-attachments &&
      mc mb --ignore-existing local/aw-artifacts &&
      echo 'minio buckets ready'
      "
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────────
  # Temporal — Workflow Runtime (§4.4, §14, §47.2)
  # Đây KHÔNG phải Agent Runtime (§2.1).
  # ───────────────────────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: agentworkflow
      POSTGRES_PWD: agentworkflow
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ["7233:7233"]
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal: {condition: service_healthy}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8233:8080"]
    restart: unless-stopped

  # CLI Temporal. Không chạy thường trực — dùng khi cần:
  #     docker compose run --rm temporal-admin temporal workflow list
  temporal-admin:
    image: temporalio/admin-tools:1.27.2-tctl-1.18.2-cli-1.3.0
    depends_on:
      temporal: {condition: service_healthy}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]
    profiles: [tools]

  # ───────────────────────────────────────────────────────────────────────────
  # Observability (§4.10, §36)
  # Lưu ý §2.2: OpenTelemetry trace là trace hạ tầng, TÁCH BIỆT với Execution
  # Trace (dữ liệu sản phẩm, nằm trong PostgreSQL). Hai thứ chỉ correlate với
  # nhau qua execution_trace_id / otel_trace_id.
  # ───────────────────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # Tiến trình ứng dụng (profile: app)
  #
  # Cùng một codebase, ba entrypoint khác nhau, ba container khác nhau — đúng
  # theo ADR-0001 quy tắc 4. Đây là thứ cho phép scale độc lập theo workload
  # class (§43) dù chưa tách repo hay ngôn ngữ.
  # ───────────────────────────────────────────────────────────────────────────
  api:
    <<: *app-base
    command: ["python", "-m", "uvicorn", "app.entrypoints.http:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]

  agent:
    <<: *app-base
    command: ["python", "-m", "uvicorn", "app.entrypoints.agent:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    ports: ["8001:8001"]

  worker:
    <<: *app-base
    command: ["python", "-m", "app.entrypoints.worker"]

volumes:
  pgdata:
  miniodata:
