# AgentWorkflow - Alembic configuration.
#
# LUU Y: file nay duoc configparser doc bang encoding cua he dieu hanh (cp1252
# tren Windows), khong phai UTF-8. Vi vay noi dung phai la ASCII thuan - khong
# dau tieng Viet. Moi mo ta chi tiet nam trong services/api/alembic/env.py.

[alembic]
script_location = services/api/alembic
prepend_sys_path = services/api
path_separator = os

# Database URL duoc doc tu bien moi truong AW_DATABASE_URL trong env.py.
# Khong dat o day de tranh commit credential vao repo.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
